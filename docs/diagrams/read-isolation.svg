<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="read-isolation">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A73E8"/></marker></defs>
<rect width="1200" height="760" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" fill="#202124">
<text x="32" y="44" font-size="28" font-weight="700">图 5 · 读与审计隔离：不把重 I/O 塞回简报热路径</text>
<text x="32" y="76" font-size="17">“不取 writer”适用于图中的专用只读链；普通管理工具的 resolveHandle 仍可能 open / touch。</text>
<rect x="32" y="120" width="330" height="115" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="50" y="150" font-size="20" font-weight="700">热读 · board / task / brief</text>
<text x="50" y="178" font-size="17">已发布 state + 运行时租约取样</text>
<text x="50" y="203" font-size="17">views → DTO / allowedOps / digest</text>
<rect x="435" y="120" width="330" height="115" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="453" y="150" font-size="20" font-weight="700">完整 health · 显式请求</text>
<text x="453" y="178" font-size="17">healthAsync → isolatedHealth</text>
<text x="453" y="203" font-size="17">受限 health-audit worker</text>
<rect x="838" y="120" width="330" height="115" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="856" y="150" font-size="20" font-weight="700">专用冷读 · MCP / 资源</text>
<text x="856" y="178" font-size="17">project-reader / 锁外状态回放</text>
<text x="856" y="203" font-size="17">知识搜索走独立 knowledge worker</text>
<rect x="32" y="365" width="330" height="145" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="50" y="395" font-size="20" font-weight="700">内存投影</text>
<text x="50" y="423" font-size="17">brief 用 healthSummary</text>
<text x="50" y="448" font-size="17">标 evidence unchecked</text>
<text x="50" y="473" font-size="17">不重审文件 / blobs / Git</text>
<rect x="435" y="365" width="330" height="145" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="453" y="395" font-size="20" font-weight="700">隔离审计</text>
<text x="453" y="423" font-size="17">检查快照 / 证据 / 文件 / Git</text>
<text x="453" y="448" font-size="17">超时、队列或时效拒绝不是通过</text>
<text x="453" y="473" font-size="17">不执行 command / test ref</text>
<rect x="838" y="365" width="330" height="145" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="856" y="395" font-size="20" font-weight="700">已发布状态或有效日志前缀</text>
<text x="856" y="423" font-size="17">同进程 writer：取已发布状态</text>
<text x="856" y="448" font-size="17">否则锁外验证并回放</text>
<text x="856" y="473" font-size="17">不取 writer、不触发 recover</text>
<path d="M 197 235 V 365" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 600 235 V 365" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1003 235 V 365" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="47" y="301" font-size="18">低成本摘要</text>
<text x="618" y="301" font-size="18">重 I/O 与 prompt 隔离</text>
<text x="1020" y="283" font-size="16">不修尾</text>
<text x="1020" y="308" font-size="16">不续租</text>
<text x="1020" y="333" font-size="16">不写快照</text>
<rect x="32" y="585" width="1136" height="118" rx="12" fill="white" stroke="#5F6368" stroke-width="2"/>
<text x="50" y="615" font-size="20" font-weight="700">读取水位不是写入权威</text>
<text x="50" y="643" font-size="17">其他进程写入时，锁外前缀不能证明 fsync 完成；只供展示，不能据此判定可领取。</text>
<text x="50" y="668" font-size="17">views 并非全部纯函数：docView 读 blob，完整 health 有 I/O；正式命令仍重新校验。</text>
<text x="736" y="738" font-size="14">依据：CONTRACT / ARCHITECTURE / BACKEND-READABILITY</text>
</g>
</svg>
