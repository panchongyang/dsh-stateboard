<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="layers">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A73E8"/></marker></defs>
<rect width="1200" height="760" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" fill="#202124">
<text x="32" y="44" font-size="28" font-weight="700">图 2 · 分层与入口：调用链不等于 import 链</text>
<text x="32" y="76" font-size="17">实线箭头 = 代码依赖（指向被依赖者）；虚线箭头 = 传输调用；禁止反向依赖。</text>

<!-- 顶层依赖：shared <- core <- host，host 另可直接依赖 shared -->
<rect x="40" y="120" width="280" height="120" rx="12" fill="#E8F0FE" stroke="#5F6368" stroke-width="2"/>
<text x="58" y="150" font-size="20" font-weight="700">shared · 零依赖</text>
<text x="58" y="178" font-size="17">枚举 / 命令 / 事件 / 错误</text>
<text x="58" y="203" font-size="17">不 import 任何业务层</text>

<rect x="460" y="120" width="280" height="120" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="478" y="150" font-size="20" font-weight="700">core · 领域与应用</text>
<text x="478" y="178" font-size="17">命令总线、守卫、日志、投影</text>
<text x="478" y="203" font-size="17">只依赖 shared / core / node:*</text>

<rect x="880" y="120" width="280" height="120" rx="12" fill="#FEF7E0" stroke="#5F6368" stroke-width="2"/>
<text x="898" y="150" font-size="20" font-weight="700">host · 适配与授权</text>
<text x="898" y="178" font-size="17">DSH / HTTP / MCP 翻译</text>
<text x="898" y="203" font-size="17">不复制领域守卫</text>

<path d="M 460 180 H 320" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 880 180 H 740" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1020 120 V 100 H 180 V 120" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="92" font-size="15">host 也可直接依赖 shared</text>

<!-- 浏览器客户端：只经 HTTP 调 host 表面 -->
<rect x="40" y="350" width="280" height="150" rx="12" fill="#F3E8FD" stroke="#5F6368" stroke-width="2"/>
<text x="58" y="380" font-size="20" font-weight="700">client · 浏览器</text>
<text x="58" y="408" font-size="17">pages / components / hooks</text>
<text x="58" y="433" font-size="17">model / utils / api</text>
<text x="58" y="458" font-size="17">不 import host / core / node:*</text>

<path d="M 180 350 V 240" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="196" y="295" font-size="16">允许依赖 shared</text>

<!-- host 表面：三种传输入口统一平铺，避免各自拉线交叉 -->
<rect x="360" y="330" width="800" height="200" rx="16" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="6 4"/>
<text x="376" y="352" font-size="15" fill="#5F6368">host 表面 · 三种传输入口（鉴权后翻译为命令）</text>

<rect x="380" y="365" width="240" height="140" rx="10" fill="#FEF7E0" stroke="#5F6368" stroke-width="2"/>
<text x="398" y="395" font-size="18" font-weight="700">HTTP 入口</text>
<text x="398" y="423" font-size="16">来源 + token → human 能力</text>
<text x="398" y="451" font-size="16">先校验来源与 Origin</text>
<text x="398" y="479" font-size="16">不直接执行领域守卫</text>

<rect x="640" y="365" width="240" height="140" rx="10" fill="#FEF7E0" stroke="#5F6368" stroke-width="2"/>
<text x="658" y="395" font-size="18" font-weight="700">DSH 工具入口</text>
<text x="658" y="423" font-size="16">宿主提供 agent / cwd 身份</text>
<text x="658" y="451" font-size="16">工具 schema 与 exec</text>
<text x="658" y="479" font-size="16">不复制领域守卫</text>

<rect x="900" y="365" width="240" height="140" rx="10" fill="#FEF7E0" stroke="#5F6368" stroke-width="2"/>
<text x="918" y="395" font-size="18" font-weight="700">本机 MCP 入口</text>
<text x="918" y="423" font-size="16">独立读写凭据 / 工作会话</text>
<text x="918" y="451" font-size="16">tools/list + tools/call</text>
<text x="918" y="479" font-size="16">授权在打开 writer 前</text>

<path d="M 320 425 H 380" fill="none" stroke="#1A73E8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>

<path d="M 760 330 V 300 H 1020 V 240" fill="none" stroke="#1A73E8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="780" y="318" font-size="15">传输调用 · 鉴权后进入 host</text>

<!-- 阅读方式 -->
<rect x="40" y="570" width="1100" height="100" rx="12" fill="white" stroke="#5F6368" stroke-width="2"/>
<text x="58" y="600" font-size="20" font-weight="700">阅读方式</text>
<text x="58" y="628" font-size="17">shared ← core ← host 是 import 方向；client 经 HTTP 调 host 表面，三种入口共享同一领域核心。</text>
<text x="58" y="653" font-size="17">客户端构建：TS/TSX → esbuild → 浏览器 bundle；后端 ESM 直接加载。</text>

<text x="934" y="738" font-size="14">依据：CONTRACT / ARCHITECTURE</text>
</g>
</svg>
