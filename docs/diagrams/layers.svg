<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="layers">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A73E8"/></marker></defs>
<rect width="1200" height="700" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" fill="#202124">
<text x="32" y="44" font-size="28" font-weight="700">图 2 · 分层与入口：调用链不等于 import 链</text>
<text x="32" y="76" font-size="17">实线箭头 = 代码依赖（指向被依赖者）；虚线箭头 = 传输调用；禁止反向依赖。</text>
<rect x="40" y="120" width="280" height="120" rx="12" fill="#E8F0FE" stroke="#5F6368" stroke-width="2"/>
<text x="58" y="150" font-size="20" font-weight="700">shared · 零依赖</text>
<text x="58" y="178" font-size="17">枚举 / 命令 / 事件 / 错误</text>
<text x="58" y="203" font-size="17">不 import 任何业务层</text>
<rect x="460" y="120" width="280" height="120" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="478" y="150" font-size="20" font-weight="700">core · 领域与应用</text>
<text x="478" y="178" font-size="17">命令总线、守卫、日志、投影</text>
<text x="478" y="203" font-size="17">只依赖 shared / core / node:*</text>
<rect x="880" y="120" width="280" height="120" rx="12" fill="#FEF7E0" stroke="#5F6368" stroke-width="2"/>
<text x="898" y="150" font-size="20" font-weight="700">host · 适配与授权</text>
<text x="898" y="178" font-size="17">DSH / HTTP / MCP 翻译</text>
<text x="898" y="203" font-size="17">不复制领域守卫</text>
<path d="M 460 180 H 320" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 880 180 H 740" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1020 120 V 99 H 180 V 120" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="488" y="94" font-size="15">host 也可依赖 shared</text>
<rect x="40" y="330" width="280" height="145" rx="12" fill="#F3E8FD" stroke="#5F6368" stroke-width="2"/>
<text x="58" y="360" font-size="20" font-weight="700">client · 浏览器</text>
<text x="58" y="388" font-size="17">pages / components / hooks</text>
<text x="58" y="413" font-size="17">model / utils / api</text>
<text x="58" y="438" font-size="17">不 import host / core / node:*</text>
<path d="M 180 330 V 240" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="196" y="285" font-size="16">允许依赖 shared</text>
<rect x="460" y="340" width="280" height="105" rx="12" fill="#FEF7E0" stroke="#5F6368" stroke-width="2"/>
<text x="478" y="370" font-size="20" font-weight="700">HTTP 入口</text>
<text x="478" y="398" font-size="17">来源 + token → human 能力</text>
<rect x="880" y="340" width="280" height="105" rx="12" fill="#FEF7E0" stroke="#5F6368" stroke-width="2"/>
<text x="898" y="370" font-size="20" font-weight="700">DSH 工具入口</text>
<text x="898" y="398" font-size="17">宿主提供 agent / cwd 身份</text>
<rect x="880" y="535" width="280" height="105" rx="12" fill="#FEF7E0" stroke="#5F6368" stroke-width="2"/>
<text x="898" y="565" font-size="20" font-weight="700">本机 MCP 入口</text>
<text x="898" y="593" font-size="17">独立读写凭据 / 工作会话</text>
<path d="M 320 401 H 460" fill="none" stroke="#1A73E8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="350" y="389" font-size="16">HTTP</text>
<path d="M 600 340 V 280 H 1020 V 240" fill="none" stroke="#1A73E8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M 1020 340 V 240" fill="none" stroke="#1A73E8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M 880 587 H 810 V 280 H 1020" fill="none" stroke="#1A73E8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="40" y="535" width="700" height="105" rx="12" fill="white" stroke="#5F6368" stroke-width="2"/>
<text x="58" y="565" font-size="20" font-weight="700">阅读方式</text>
<text x="58" y="593" font-size="17">shared ← core ← host 是 import 方向；client 经 HTTP 调 host。</text>
<text x="58" y="618" font-size="17">客户端构建：TS/TSX → esbuild → 浏览器 bundle；后端 ESM 直接加载。</text>
<text x="934" y="678" font-size="14">依据：CONTRACT / ARCHITECTURE</text>
</g>
</svg>
