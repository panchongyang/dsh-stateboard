<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="module-map">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A73E8"/></marker></defs>
<rect width="1200" height="900" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" fill="#202124">
<text x="32" y="44" font-size="28" font-weight="700">图 3 · 十二模块地图：主写链与旁路</text>
<text x="32" y="76" font-size="17">箭头表示主要调用 / 数据流；模块是职责分组，不宣称每个分组都是独立目录。</text>
<rect x="32" y="112" width="1136" height="75" rx="12" fill="#E8F0FE" stroke="#5F6368" stroke-width="2"/>
<text x="50" y="142" font-size="20" font-weight="700">shared · 契约：所有层共用枚举、事件与边界</text>
<rect x="32" y="250" width="210" height="110" rx="12" fill="#F3E8FD" stroke="#5F6368" stroke-width="2"/>
<text x="50" y="280" font-size="20" font-weight="700">client</text>
<text x="50" y="308" font-size="17">页面 / 组件 / 传输</text>
<rect x="292" y="250" width="210" height="110" rx="12" fill="#FEF7E0" stroke="#5F6368" stroke-width="2"/>
<text x="310" y="280" font-size="20" font-weight="700">host</text>
<text x="310" y="308" font-size="17">入口鉴权与参数翻译</text>
<rect x="552" y="250" width="250" height="110" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="570" y="280" font-size="20" font-weight="700">project</text>
<text x="570" y="308" font-size="17">service → handle</text>
<text x="570" y="333" font-size="17">身份、注册表、命令总线</text>
<rect x="872" y="250" width="296" height="110" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="890" y="280" font-size="20" font-weight="700">command</text>
<text x="890" y="308" font-size="17">commands 注册表</text>
<text x="890" y="333" font-size="17">分发、工作投影、事件批次</text>
<path d="M 242 303 H 292" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 502 303 H 552" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 802 303 H 872" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="440" width="210" height="110" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="50" y="470" font-size="20" font-weight="700">task</text>
<text x="50" y="498" font-size="17">状态机 / lease / intent</text>
<rect x="292" y="440" width="210" height="110" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="310" y="470" font-size="20" font-weight="700">plan</text>
<text x="310" y="498" font-size="17">head / 版本 / 成员</text>
<rect x="552" y="440" width="250" height="110" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="570" y="470" font-size="20" font-weight="700">documents</text>
<text x="570" y="498" font-size="17">登记 / 观测 / 固定内容</text>
<rect x="872" y="440" width="296" height="110" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="890" y="470" font-size="20" font-weight="700">evidence</text>
<text x="890" y="498" font-size="17">材料覆盖 / hash / 审计</text>
<path d="M 1020 360 V 402 H 137 V 440" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 397 402 V 440" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 677 402 V 440" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1020 402 V 440" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="52" y="396" font-size="16">命令域处理：守卫通过才产生 events</text>
<rect x="32" y="660" width="280" height="130" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="50" y="690" font-size="20" font-weight="700">store</text>
<text x="50" y="718" font-size="17">append + fsync → 已发布 state</text>
<text x="50" y="743" font-size="17">commits / snapshot / blobs</text>
<rect x="392" y="660" width="350" height="130" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="410" y="690" font-size="20" font-weight="700">read</text>
<text x="410" y="718" font-size="17">views / digest / health</text>
<text x="410" y="743" font-size="17">state → DTO；不承载领域守卫</text>
<rect x="822" y="660" width="346" height="130" rx="12" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="840" y="690" font-size="20" font-weight="700">knowledge</text>
<text x="840" y="718" font-size="17">独立 worker / 可重建缓存</text>
<text x="840" y="743" font-size="17">搜索与重读；不参与命令事务</text>
<path d="M 1168 320 H 1180 V 625 H 172 V 660" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="190" y="615" font-size="16">各命令域返回事件批次，由 handle 统一追加</text>
<path d="M 312 722 H 392" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="331" y="710" font-size="15">state</text>
<path d="M 172 790 V 817 H 995 V 790" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="785" y="810" font-size="15">日志 / blobs 来源</text>
<path d="M 677 550 V 607 H 567 V 660" fill="none" stroke="#1A73E8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="689" y="600" font-size="15">documents 只读旁路</text>
<path d="M 392 755 H 350 V 842 H 20 V 303 H 32" fill="none" stroke="#1A73E8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="405" y="842" font-size="16">views 结果返回入口；固定对象 / 图片读取不经写命令</text>
<text x="934" y="878" font-size="14">依据：CONTRACT / ARCHITECTURE</text>
</g>
</svg>
