<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="module map">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A73E8"/></marker></defs>
<rect width="1200" height="900" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" fill="#202124">
<text x="32" y="44" font-size="28" font-weight="700">图 3 · 十二模块地图：主写链与旁路</text>
<text x="32" y="76" font-size="17">箭头表示主要调用 / 数据流；模块是职责分组，不宣称每个分组都是独立目录。</text>

<rect x="40" y="96" width="1120" height="64" rx="12" fill="#E8F0FE" stroke="#5F6368" stroke-width="2"/>
<text x="58" y="130" font-size="19" font-weight="700">shared · 契约：所有层共用枚举、事件与边界</text>

<!-- 入口与命令主链 -->
<rect x="40" y="200" width="220" height="90" rx="10" fill="#F3E8FD" stroke="#5F6368" stroke-width="2"/>
<text x="58" y="232" font-size="20" font-weight="700">client</text>
<text x="58" y="260" font-size="16">页面 / 组件 / 传输</text>

<rect x="40" y="330" width="220" height="100" rx="10" fill="#FEF7E0" stroke="#5F6368" stroke-width="2"/>
<text x="58" y="362" font-size="20" font-weight="700">host</text>
<text x="58" y="390" font-size="16">入口鉴权与参数翻译</text>

<rect x="340" y="330" width="240" height="100" rx="10" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="358" y="362" font-size="20" font-weight="700">project</text>
<text x="358" y="390" font-size="16">service → handle</text>
<text x="358" y="414" font-size="16">身份、注册表、命令总线</text>

<rect x="660" y="330" width="240" height="100" rx="10" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="678" y="362" font-size="20" font-weight="700">command</text>
<text x="678" y="390" font-size="16">commands 注册表</text>
<text x="678" y="414" font-size="16">分发、工作投影、事件批次</text>

<path d="M 150 290 V 330" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 260 380 H 340" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 580 380 H 660" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>

<!-- 命令域：统一分发总线，四个领域模块平铺 -->
<path d="M 780 430 V 465" fill="none" stroke="#1A73E8" stroke-width="2"/>
<path d="M 160 465 H 1000" fill="none" stroke="#1A73E8" stroke-width="2"/>
<path d="M 160 465 V 500" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 440 465 V 500" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 720 465 V 500" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1000 465 V 500" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="180" y="455" font-size="15">命令分发（守卫通过后）</text>

<rect x="40" y="500" width="240" height="110" rx="10" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="58" y="532" font-size="20" font-weight="700">task</text>
<text x="58" y="560" font-size="16">状态机 / lease / intent</text>

<rect x="320" y="500" width="240" height="110" rx="10" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="338" y="532" font-size="20" font-weight="700">plan</text>
<text x="338" y="560" font-size="16">head / 版本 / 成员</text>

<rect x="600" y="500" width="240" height="110" rx="10" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="618" y="532" font-size="20" font-weight="700">documents</text>
<text x="618" y="560" font-size="16">登记 / 观测 / 固定内容</text>

<rect x="880" y="500" width="240" height="110" rx="10" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="898" y="532" font-size="20" font-weight="700">evidence</text>
<text x="898" y="560" font-size="16">材料覆盖 / hash / 审计</text>

<!-- 领域结果统一汇入 store -->
<path d="M 160 610 V 640" fill="none" stroke="#1A73E8" stroke-width="2"/>
<path d="M 440 610 V 640" fill="none" stroke="#1A73E8" stroke-width="2"/>
<path d="M 720 610 V 640" fill="none" stroke="#1A73E8" stroke-width="2"/>
<path d="M 1000 610 V 640" fill="none" stroke="#1A73E8" stroke-width="2"/>
<path d="M 160 640 H 1000" fill="none" stroke="#1A73E8" stroke-width="2"/>
<path d="M 520 640 V 680" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="180" y="658" font-size="15">事件批次 / 状态提交</text>

<rect x="320" y="680" width="400" height="120" rx="10" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="338" y="712" font-size="20" font-weight="700">store</text>
<text x="338" y="740" font-size="16">append + fsync → 已发布 state</text>
<text x="338" y="764" font-size="16">commits / snapshot / blobs</text>

<!-- 读侧：store 是唯一来源；read 返回 host，knowledge 走旁路 -->
<rect x="40" y="680" width="240" height="120" rx="10" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="58" y="712" font-size="20" font-weight="700">read</text>
<text x="58" y="740" font-size="16">views / digest / health</text>
<text x="58" y="764" font-size="16">state → DTO</text>
<text x="58" y="788" font-size="16">→ host 视图返回</text>

<rect x="820" y="680" width="320" height="120" rx="10" fill="#E6F4EA" stroke="#5F6368" stroke-width="2"/>
<text x="838" y="712" font-size="20" font-weight="700">knowledge</text>
<text x="838" y="740" font-size="16">独立 worker / 可重建缓存</text>
<text x="838" y="764" font-size="16">搜索与重读；不参与命令事务</text>

<path d="M 320 735 H 280" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="292" y="725" font-size="15">state</text>
<path d="M 720 735 H 820" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="730" y="725" font-size="15">日志 / blobs</text>


<text x="934" y="878" font-size="14">依据：CONTRACT / ARCHITECTURE</text>
</g>
</svg>